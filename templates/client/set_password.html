{% extends 'client/base.html' %}
{% block title %}Set Password | CBS{% endblock %}
{% block page_heading %}Create Password{% endblock %}

{% block content %}
<div class="card" style="max-width:520px;">
    <div class="card-header"><h3>Create a password</h3></div>
    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label for="id_phone">Phone</label>
            <input class="form-control" id="id_phone" name="phone" required />
        </div>
        <div class="form-group">
            <label for="id_password">Password</label>
            <input class="form-control" id="id_password" name="password" type="password" required />
        </div>
        <div class="form-group">
            <label for="id_password_confirm">Confirm password</label>
            <input class="form-control" id="id_password_confirm" name="password_confirm" type="password" required />
        </div>
        <button class="btn btn-primary" type="submit">Set password</button>
    </form>
    <p style="margin-top:0.75rem"><a href="{% url 'client-login' %}">Back to login</a></p>
</div>
{% endblock %}
