{% extends 'client/base.html' %}
{% block title %}Transfer | CBS{% endblock %}
{% block page_heading %}Transfer{% endblock %}

{% block content %}
<div class="grid-2">
    <div class="card">
        <div class="card-header">
            <h3>Send money</h3>
            <span class="badge warning">Secure</span>
        </div>
        <form>
            <div class="form-group">
                <label for="recipient">Recipient</label>
                <input class="form-control" id="recipient" type="text" placeholder="Recipient name or account" />
            </div>
            <div class="form-group">
                <label for="amount">Amount</label>
                <input class="form-control" id="amount" type="text" placeholder="Enter amount" />
            </div>
            <div class="form-group">
                <label for="note">Note</label>
                <input class="form-control" id="note" type="text" placeholder="Optional note" />
            </div>
            <button class="btn btn-primary" type="button">Confirm transfer</button>
        </form>
    </div>

    <div class="card">
        <div class="card-header">
            <h3>Transfer status</h3>
            <span class="badge success">Approved</span>
        </div>
        <table class="table">
            <tr><th>Reference</th><td>#TR-1042</td></tr>
            <tr><th>Channel</th><td>Instant</td></tr>
            <tr><th>Fee</th><td>0.00 XAF</td></tr>
        </table>
    </div>
</div>
{% endblock %}
